# HomeHub — production-ish local stack.
# Backend + Postgres + frontend, all LAN-only. Remote access is expected to
# come through a Cloudflare Tunnel pointed at the frontend (and optionally
# the API), so nothing here publishes beyond the host.
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: homehub
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-homehub}
      POSTGRES_DB: homehub
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U homehub"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://homehub:${POSTGRES_PASSWORD:-homehub}@db:5432/homehub
      DB_AUTO_CREATE: "true"   # switch to alembic upgrade head once schema settles
      HA_MOCK: ${HA_MOCK:-true}
      HA_URL: ${HA_URL:-http://homeassistant.local:8123}
      HA_TOKEN: ${HA_TOKEN:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:8000}
      NEXT_PUBLIC_WS_URL: ${PUBLIC_WS_URL:-ws://localhost:8000/ws}
    depends_on:
      - backend
    ports:
      - "3000:3000"

volumes:
  pgdata:
