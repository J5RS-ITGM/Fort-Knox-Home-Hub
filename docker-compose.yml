# HomeHub stack — db + backend + frontend.
#
# Shared-box friendly: services bind to 127.0.0.1 on non-default ports by
# default, so a host reverse proxy (nginx/Caddy) terminates TLS and routes
# one domain to them alongside other apps. See deploy/ for proxy examples.
# For a LAN deployment (kitchen Pi), set BIND_ADDR=0.0.0.0 in .env.
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: homehub
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: homehub
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U homehub"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://homehub:${POSTGRES_PASSWORD}@db:5432/homehub
      DB_AUTO_CREATE: "true"   # switch to alembic upgrade head once schema settles
      HA_MOCK: ${HA_MOCK:-true}
      HA_URL: ${HA_URL:-http://homeassistant.local:8123}
      HA_TOKEN: ${HA_TOKEN:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      SESSION_TTL_DAYS: ${SESSION_TTL_DAYS:-30}
      # Same-origin behind the reverse proxy -> no CORS needed (empty).
      # For split-origin dev, set e.g. http://localhost:3000
      CORS_ORIGINS: ${CORS_ORIGINS:-}
    volumes:
      - ./seed.json:/app/seed.json:ro
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${BACKEND_PORT:-8100}:8000"

  frontend:
    build: ./frontend
    restart: unless-stopped
    # No NEXT_PUBLIC_* URLs: the app defaults to same-origin (/api, /ws),
    # which is exactly right behind the reverse proxy.
    depends_on:
      - backend
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${FRONTEND_PORT:-3100}:3000"

volumes:
  pgdata:
